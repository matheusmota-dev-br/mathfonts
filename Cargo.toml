[package]
name = "mathfonts"
version = "0.1.0"
edition = "2021"
description = "Checks the math fonts of the catalog and builds its site, drawing every example with mathra."
publish = false

[dependencies]
mathra = "1.10"
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
